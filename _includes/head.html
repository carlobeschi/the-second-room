<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% if page.title and page.url != "/" %}{% capture ptitle %}{{ page.title }} · {{ site.title }}{% endcapture %}{% else %}{% assign ptitle = site.title %}{% endif %}
<title>{{ ptitle | escape }}</title>
<meta name="description" content="{{ page.description | default: site.description | strip_newlines | escape }}">
<meta property="og:title" content="{{ ptitle | escape }}">
<meta property="og:description" content="{{ page.description | default: site.description | strip_newlines | escape }}">
<meta property="og:type" content="{% if page.collection == 'episodes' %}article{% else %}website{% endif %}">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="{{ '/assets/mark.svg' | relative_url }}" type="image/svg+xml">
<link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
<script>
  // Theme: follow the system unless the reader picked one.
  try { var t = localStorage.getItem('tsr-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
